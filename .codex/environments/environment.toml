'''

[setup.win32]
script = '''
$ErrorActionPreference = "Stop"

$env:UV_CACHE_DIR = if ($env:UV_CACHE_DIR) { $env:UV_CACHE_DIR } else { "artifacts\uv-cache" }
$env:TEMP = if ($env:TEMP) { $env:TEMP } else { "artifacts\tool-temp" }
$env:TMP = if ($env:TMP) { $env:TMP } else { $env:TEMP }
$env:PIP_CACHE_DIR = if ($env:PIP_CACHE_DIR) { $env:PIP_CACHE_DIR } else { "artifacts\pip-cache" }
New-Item -ItemType Directory -Force $env:UV_CACHE_DIR, $env:TEMP, $env:PIP_CACHE_DIR | Out-Null

if (-not (Get-Command uv -ErrorAction SilentlyContinue)) {
    throw "uv is required for this project. Install it with: winget install --id=astral-sh.uv -e"
}

uv sync --extra test
uv run python --version
'''

