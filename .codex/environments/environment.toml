# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "PyPlot"

[setup]
script = ""

[setup.darwin]
script = '''
set -e

export UV_CACHE_DIR="${UV_CACHE_DIR:-artifacts/uv-cache}"
export TMPDIR="${TMPDIR:-artifacts/tool-temp}"
export TEMP="${TEMP:-$TMPDIR}"
export TMP="${TMP:-$TMPDIR}"
export PIP_CACHE_DIR="${PIP_CACHE_DIR:-artifacts/pip-cache}"
mkdir -p "$UV_CACHE_DIR" "$TMPDIR" "$PIP_CACHE_DIR"

command -v uv >/dev/null 2>&1 || {
  echo "uv is required for this project. Install it and retry: https://docs.astral.sh/uv/getting-started/installation/" >&2
  exit 1
}

uv sync --extra test
uv run python --version
'''

[setup.win32]
script = '''
$ErrorActionPreference = "Stop"

$env:UV_CACHE_DIR = if ($env:UV_CACHE_DIR) { $env:UV_CACHE_DIR } else { "artifacts\uv-cache" }
$env:TEMP = if ($env:TEMP) { $env:TEMP } else { "artifacts\tool-temp" }
$env:TMP = if ($env:TMP) { $env:TMP } else { $env:TEMP }
$env:PIP_CACHE_DIR = if ($env:PIP_CACHE_DIR) { $env:PIP_CACHE_DIR } else { "artifacts\pip-cache" }
New-Item -ItemType Directory -Force $env:UV_CACHE_DIR, $env:TEMP, $env:PIP_CACHE_DIR | Out-Null

$localUvBin = Join-Path $env:USERPROFILE ".local\bin"
if ((-not (Get-Command uv -ErrorAction SilentlyContinue)) -and (Test-Path (Join-Path $localUvBin "uv.exe"))) {
    $env:Path = "$localUvBin;$env:Path"
}

$python314 = $null
if (Get-Command py -ErrorAction SilentlyContinue) {
    py -3.14 --version
    if ($LASTEXITCODE -eq 0) {
        $python314 = "3.14"
    }
}
if (-not $python314) {
    $standardPython314 = Join-Path $env:LOCALAPPDATA "Programs\Python\Python314\python.exe"
    if (Test-Path $standardPython314) {
        & $standardPython314 -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 14) else 1)"
        if ($LASTEXITCODE -eq 0) {
            $python314 = $standardPython314
        }
    }
}
if (-not $python314) {
    throw "Python 3.14 is required for this project. Install it and ensure py -0p lists a 3.14 interpreter, or install it at $env:LOCALAPPDATA\Programs\Python\Python314, then retry."
}

if (-not (Get-Command uv -ErrorAction SilentlyContinue)) {
    throw "uv is required for this project. Install it with: winget install --id=astral-sh.uv -e"
}

uv sync --extra test --python $python314
uv run python --version
'''

[[actions]]
name = "Run"
icon = "run"
command = ".venv/bin/python launcher.py"
platform = "darwin"

