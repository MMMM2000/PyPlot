[setup.darwin]
script = '''
set -e

export UV_CACHE_DIR="${UV_CACHE_DIR:-artifacts/uv-cache}"
export TMPDIR="${TMPDIR:-artifacts/tool-temp}"
export TEMP="${TEMP:-$TMPDIR}"
export TMP="${TMP:-$TMPDIR}"
export PIP_CACHE_DIR="${PIP_CACHE_DIR:-artifacts/pip-cache}"
mkdir -p "$UV_CACHE_DIR" "$TMPDIR" "$PIP_CACHE_DIR"

command -v uv >/dev/null 2>&1 || {
  echo "uv is required for this project. Install it and retry: https://docs.astral.sh/uv/getting-started/installation/" >&2
