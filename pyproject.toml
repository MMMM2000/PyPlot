[project]
name = "python-plot"
version = "0.1.0"
description = "PyQt6 data logging and plotting utilities"
authors = [{name = "Unknown"}]
dependencies = [
    "PyQt6",
    "matplotlib",
    "numpy",
    "pandas",
    "pyserial",
]
requires-python = ">=3.8"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
launcher = "launcher:main"
plot-cli = "plotting.cli:main"

[tool.setuptools.packages.find]
include = ["data_logger", "plotting"]

[tool.setuptools.package-data]
plotting = ["default_config.json"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
