[project]
name = "python-plot"
version = "0.1.0"
description = "PyQt6 data logging and plotting utilities"
authors = [{name = "Unknown"}]
dependencies = [
    "PyQt6==6.11.0",
    "matplotlib==3.10.9",
    "numpy==2.4.4",
    "pandas==3.0.2",
    "scipy==1.17.1",
    "openpyxl==3.1.5",
    "originpro==1.1.15; sys_platform == \"win32\"",
    "originext==1.2.5; sys_platform == \"win32\"",
    "pypdf==6.10.2",
    "pypdfium2==5.7.1",
    "python-pptx==1.0.2",
    "pyqtgraph==0.14.0",
    "plotly==6.7.0",
    "reportlab==4.4.10",
    "XlsxWriter==3.2.9",
    "tqdm==4.67.3",
    "pyinstaller==6.20.0",
    "pyserial==3.5",
    "pyusb==1.3.1",
    "libusb-package==1.0.26.1",
    "psutil==7.2.2",
    "zeroconf==0.148.0",
]
requires-python = ">=3.14,<3.15"

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-qt==4.5.0",
]

[project.scripts]
launcher = "launcher:main"

[tool.setuptools.packages.find]
include = [
    "data_logging",
    "data_logging.*",
    "plotting",
    "plotting.*",
    "emulators",
    "emulators.*",
    "microwire_data_builder",
    "microwire_data_builder.*",
    "microwire_eda",
    "microwire_eda.*",
]

[tool.setuptools.package-data]
plotting = ["default_config.json"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--capture=sys"
