[project]
name = "python-plot"
version = "0.1.0"
description = "PyQt6 data logging and plotting utilities"
authors = [{name = "Unknown"}]
dependencies = [
    "PyQt6==6.9.1",
    "matplotlib==3.10.7",
    "numpy==2.3.4",
    "pandas==2.3.3",
    "openpyxl==3.1.5",
    "originpro==1.1.14",
    "pypdf==6.1.2",
    "pypdfium2==5.0.0",
    "pyqtgraph==0.13.7",
    "plotly==6.3.1",
    "reportlab==4.2.5",
    "XlsxWriter==3.2.9",
    "tqdm==4.67.1",
    "pyinstaller==6.16.0",
    "pyserial==3.5",
    "psutil==7.1.1",
    "zeroconf==0.148.0",
    "paddleocr==3.3.0",
    "paddlepaddle==3.2.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
launcher = "launcher:main"

[tool.setuptools.packages.find]
include = ["data_logging", "plotting", "emulators"]

[tool.setuptools.package-data]
plotting = ["default_config.json"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
