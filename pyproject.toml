[project]
name = "python-plot"
version = "0.1.0"
description = "PyQt6 data logging and plotting utilities"
authors = [{name = "Unknown"}]
dependencies = [
    "PyQt6==6.10.2",
    "matplotlib==3.10.8",
    "numpy==2.4.2",
    "pandas==3.0.1",
    "openpyxl==3.1.5",
    "originpro==1.1.14; sys_platform == \"win32\"",
    "pypdf==6.7.5",
    "pypdfium2==5.5.0",
    "pyqtgraph==0.14.0",
    "plotly==6.6.0",
    "reportlab==4.4.10",
    "XlsxWriter==3.2.9",
    "tqdm==4.67.3",
    "pyinstaller==6.19.0",
    "pyserial==3.5",
    "psutil==7.2.2",
    "zeroconf==0.148.0",
]
requires-python = ">=3.13,<3.14"

[project.optional-dependencies]
test = [
    "pytest==9.0.2",
    "pytest-qt==4.5.0",
]

[project.scripts]
launcher = "launcher:main"

[tool.setuptools.packages.find]
include = ["data_logging", "plotting", "emulators", "microwire_data_builder", "microwire_eda"]

[tool.setuptools.package-data]
plotting = ["default_config.json"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--capture=sys"
