<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plotly React Example</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div id="root" class="max-w-3xl mx-auto p-4"></div>
  <script type="text/javascript">
    function PlotlyChart() {
      React.useEffect(() => {
        const trace = {
          x: [1, 2, 3, 4, 5],
          y: [1, 4, 9, 16, 25],
          mode: 'lines+markers',
          marker: { color: '#e11d48' },
        };
        const layout = {
          margin: { t: 20 },
          paper_bgcolor: 'transparent',
          plot_bgcolor: 'transparent',
        };
        Plotly.newPlot('chart', [trace], layout, { responsive: true });
      }, []);
      return React.createElement('div', { id: 'chart', className: 'rounded-lg shadow-md' });
    }

    function App() {
      return React.createElement('div', null,
        React.createElement('h1', { className: 'text-2xl font-bold mb-4 text-center' }, 'Plotly React Modern UI'),
        React.createElement(PlotlyChart)
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
