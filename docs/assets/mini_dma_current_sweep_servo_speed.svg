<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430">
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Iso-stress/current-sweep dynamic balance speed</text>
  <line x1="86" y1="342" x2="690" y2="342" stroke="#222" stroke-width="2"/>
  <line x1="86" y1="70" x2="86" y2="342" stroke="#222" stroke-width="2"/>
  <text x="388" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15">absolute stress/load error</text>
  <text x="24" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" transform="rotate(-90 24 205)">speed command</text>
  <g stroke="#ddd" stroke-width="1">
    <line x1="86" y1="70" x2="690" y2="70"/>
    <line x1="86" y1="160" x2="690" y2="160"/>
    <line x1="86" y1="250" x2="690" y2="250"/>
    <line x1="86" y1="342" x2="690" y2="342"/>
  </g>
  <path d="M86 334 L180 306 L275 270 L370 232 L465 190 L560 145 L650 101 L690 70"
        fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
  <path d="M86 319 L180 276 L275 225 L370 174 L465 122 L560 82 L610 70 L690 70"
        fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <line x1="610" y1="70" x2="690" y2="70" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <rect x="436" y="275" width="240" height="74" fill="#fff" stroke="#ddd"/>
    <line x1="454" y1="296" x2="510" y2="296" stroke="#16a34a" stroke-width="4"/>
    <text x="520" y="300">error only: Kp * error</text>
    <line x1="454" y1="326" x2="510" y2="326" stroke="#dc2626" stroke-width="4"/>
    <text x="520" y="330">error + away-rate boost</text>
  </g>
  <text x="588" y="61" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#dc2626">clamped by max mm/s</text>
  <text x="250" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#333">speed = (Kp * |error| + Kd * away_rate) / sensitivity</text>
</svg>
