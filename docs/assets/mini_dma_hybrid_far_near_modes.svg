<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520">
  <rect width="1040" height="520" fill="#ffffff"/>
  <text x="520" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Hybrid far / near load-stress control</text>
  <text x="520" y="73" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">The boundary is based on predicted stopping distance before the next useful balance reply, not on a wide fixed hysteresis band.</text>

  <line x1="115" y1="410" x2="940" y2="410" stroke="#111827" stroke-width="2"/>
  <line x1="115" y1="95" x2="115" y2="410" stroke="#111827" stroke-width="2"/>
  <text x="530" y="458" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#111827">remaining predicted correction distance</text>
  <text x="30" y="250" transform="rotate(-90 30 250)" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#111827">allowed motor response</text>

  <rect x="115" y="95" width="300" height="315" fill="#fff7ed"/>
  <rect x="415" y="95" width="525" height="315" fill="#ecfdf5"/>
  <line x1="415" y1="95" x2="415" y2="410" stroke="#f97316" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="265" y="124" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#c2410c">Near / gated</text>
  <text x="680" y="124" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#047857">Far / cruise</text>

  <path d="M135 386 C215 360 315 305 415 240 C550 155 730 130 915 124" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <text x="735" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1d4ed8">dynamic speed from error, trend, stiffness</text>

  <path d="M415 240 L345 240" stroke="#f97316" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowOrange)"/>
  <path d="M445 240 L610 210" stroke="#16a34a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowGreen)"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#374151">
    <text x="160" y="175">Use one correction.</text>
    <text x="160" y="200">Wait for move complete.</text>
    <text x="160" y="225">Then require post-move scale.</text>
    <text x="500" y="175">Keep motor moving toward an extended target.</text>
    <text x="500" y="200">Each fresh scale sample revises prediction.</text>
    <text x="500" y="225">Drop back if trend is wrong or target is close.</text>
  </g>

  <g font-family="Consolas, monospace" font-size="15" fill="#111827">
    <text x="150" y="300">boundary =</text>
    <text x="150" y="324">speed * scale_interval * 1.25</text>
    <text x="150" y="348">+ max(2 steps, backlash, tolerance)</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">
    <text x="170" y="432">close</text>
    <text x="910" y="432">far</text>
  </g>

  <defs>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
