<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500">
  <rect width="1040" height="500" fill="#ffffff"/>
  <text x="520" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Gated speed compensation</text>
  <text x="520" y="73" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">The requested speed is the average over move + settle + scale wait, so the motor can move faster during the moving part.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#111827">
    <text x="90" y="130" font-weight="700">Without compensation</text>
    <text x="90" y="300" font-weight="700">With compensation</text>
  </g>

  <line x1="140" y1="180" x2="900" y2="180" stroke="#d1d5db" stroke-width="3"/>
  <line x1="140" y1="350" x2="900" y2="350" stroke="#d1d5db" stroke-width="3"/>

  <rect x="140" y="158" width="380" height="44" rx="8" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
  <rect x="520" y="158" width="230" height="44" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="330" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9a3412">move at 1.0 mm/s</text>
  <text x="635" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#374151">settle + scale wait</text>
  <text x="780" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#991b1b">average too slow</text>

  <rect x="140" y="328" width="190" height="44" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <rect x="330" y="328" width="230" height="44" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="235" y="355" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#166534">move at 2.5 mm/s</text>
  <text x="445" y="355" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#374151">settle + scale wait</text>
  <text x="600" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#166534">cycle average matches 1.0 mm/s</text>

  <g stroke="#111827" stroke-width="2">
    <line x1="140" y1="225" x2="520" y2="225"/>
    <line x1="140" y1="218" x2="140" y2="232"/>
    <line x1="520" y1="218" x2="520" y2="232"/>
    <line x1="140" y1="395" x2="560" y2="395"/>
    <line x1="140" y1="388" x2="140" y2="402"/>
    <line x1="560" y1="388" x2="560" y2="402"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151" text-anchor="middle">
    <text x="330" y="247">same correction distance</text>
    <text x="350" y="417">same correction distance per cycle</text>
  </g>

  <g font-family="Consolas, monospace" font-size="16" fill="#111827">
    <text x="115" y="455">command_speed = correction_mm / (correction_mm / desired_average_speed - dead_time)</text>
  </g>
</svg>
