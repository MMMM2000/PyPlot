<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Sample-driven load/stress correction clock</text>
  <line x1="80" y1="170" x2="700" y2="170" stroke="#222" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#222">
    <text x="80" y="205" text-anchor="middle">0 ms</text>
    <text x="235" y="205" text-anchor="middle">250 ms</text>
    <text x="390" y="205" text-anchor="middle">500 ms</text>
    <text x="545" y="205" text-anchor="middle">750 ms</text>
    <text x="700" y="205" text-anchor="middle">1000 ms</text>
  </g>
  <g stroke="#2563eb" stroke-width="3" fill="#2563eb">
    <circle cx="80" cy="170" r="8"/>
    <circle cx="235" cy="170" r="8"/>
    <circle cx="390" cy="170" r="8"/>
    <circle cx="545" cy="170" r="8"/>
    <circle cx="700" cy="170" r="8"/>
  </g>
  <g stroke="#f97316" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M90 150 C130 118 178 112 225 150"/>
    <path d="M245 150 C285 118 333 112 380 150"/>
    <path d="M400 150 C440 118 488 112 535 150"/>
    <path d="M555 150 C595 118 643 112 690 150"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316"/>
    </marker>
  </defs>
  <text x="157" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f97316">move + settle</text>
  <text x="312" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f97316">move + settle</text>
  <text x="467" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f97316">move + settle</text>
  <text x="622" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f97316">move + settle</text>
  <text x="390" y="258" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#333">Load/stress decisions are made on fresh scale samples, not every UI/control tick.</text>
  <text x="390" y="286" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#333">Motor can move smoothly between samples, but the next closed-loop correction waits for new force feedback.</text>
</svg>
