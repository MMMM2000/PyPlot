schema_version: 1
kind: mini_dma_optimization_campaign
campaign:
  id: 2026-06-04_Ni50Fe27Ga23_12-2_heat_shield_33p68mm_80ma
  title: Ni50Fe27Ga23 12/2 heat shield 33.68 mm 80 mA Mini DMA optimization
  root: G:/My Drive/1 Projects/Praha/mini DMA/automation_history/campaigns/2026-06-04_Ni50Fe27Ga23_12-2_heat_shield_33p68mm_80ma
  owner_thread: codex/mini-dma-live-opt-12-2-12e8
objective:
  primary: safely straighten/preload the mounted 12/2 heat-shield wire, then run a repeatable Mini DMA iso-stress current sweep only after CH3/Tic VIN and full preflight are clean
  optimize_for_generalization: true
  success_metrics:
    - stress_error_rms_mpa
    - stress_error_p95_abs_mpa
    - stress_error_max_abs_mpa
    - current_hold_elapsed_s
    - total_measurement_time_s
    - strain_current_curve_quality
  tradeoff_question: check whether the default 0.8 mA/s ramp gives acceptable stress precision before trying slower ramps
  avoid_sample_specific_magic_values: true
  hard_values_policy: use hard caps only for safety or campaign-local experiments; do not tune permanent control logic to one sample/run
sample:
  composition: Ni50Fe27Ga23
  microwire: 12/2
  condition: heat shield
  length_mm: 33.68
  diameter_mm: 0.0191
  diameter_source: app shows 19.1 um unless a more specific source is verified before run
  mounted_wire_status: mounted_as_of_2026-06-04_not_straight
  operator_confirmation_required:
    - wire is mounted and mechanically intact
    - sample identity is Ni50Fe27Ga23 12/2 heat shield or this manifest is updated before use
    - unloaded gauge length remains 33.68 mm after straightening or length_mm is updated
    - diameter source is still appropriate for the mounted specimen
control_source:
  required_base_ref: origin/codex/integration-mini-dma-ready-review
  required_branch_prefix: codex/
  require_clean_git: true
  require_up_to_date_with_base: true
  approved_control_logic_version: 2026-05-29.2
hardware:
  require_shared_hmp: true
  broker_host: 127.0.0.1
  broker_port: 8765
  hmp_resource: COM3
  motor_channel: CH3
  current_channel: CH4
  preserve_channels:
    - CH3
  reserved_elsewhere:
    - role: ac_susceptibility
      rule: respect active broker leases and roles; do not directly probe or control the AC channel
  current_voltage_limit_v: 32.05
  current_max_setpoint_mA: 80.0
  operator_confirmation_required:
    - broker profile exposes CH3 for Mini DMA motor rail and CH4 for Mini DMA current sweep
    - CH3 motor rail is preserved according to broker state and Mini DMA preflight
    - CH4 current path is connected through the mounted wire and output is off before Mini DMA ownership
    - no active broker lease conflicts with CH3 or CH4
safety:
  max_stress_mpa: 300.0
  recovery_stress_mpa: 50.0
  wire_break_stops_plan: true
  allow_mechanical_slack_takeup: true
  max_correction_travel_fraction: 0.15
  live_authorization_required: true
run_plan:
  target_basis: stress_mpa
  target_mpa: 50.0
  first_overheating:
    enabled: false
  stages:
    - id: future_baseline_0p8
      recipe_path: docs/recipes/iso-stress-50mpa-1-to-80-to-1ma.recipe.json
      current_ramp_rate_mA_s: 0.8
      repeat: 1
    - id: future_repeat_0p8_if_promising
      recipe_path: docs/recipes/iso-stress-50mpa-1-to-80-to-1ma.recipe.json
      current_ramp_rate_mA_s: 0.8
      repeat: 1
      run_condition: repeat only if the first run has intact current path and acceptable stress-control behavior
    - id: baseline_0p6_time_precision_comparison
      recipe_path: docs/recipes/iso-stress-50mpa-1-to-80-to-1ma-0p6.recipe.json
      current_ramp_rate_mA_s: 0.6
      repeat: 1
      run_condition: run after reverting the unsuccessful fast-recovery experiment to compare precision against measurement time
  comparison_policy:
    baseline_stage: future_baseline_0p8
    slower_ramps_must_justify_time_cost: true
    next_adjustment_rule: if the first run is bad, adjust only the smallest justified campaign parameter before rerun
runs:
  - id: run29_baseline_0p8
    path: G:/My Drive/1 Projects/Praha/mini DMA/automated_control_tests/Ni50Fe27Ga23 12_2 heat shield iso-stress_run29
    stage: future_baseline_0p8
  - id: run30_fast_recovery_experiment_0p8
    path: G:/My Drive/1 Projects/Praha/mini DMA/automated_control_tests/Ni50Fe27Ga23 12_2 heat shield iso-stress_run30
    stage: experimental_fast_recovery_0p8
    disposition: rejected_worse_stress_error
  - id: run31_baseline_0p6
    path: G:/My Drive/1 Projects/Praha/mini DMA/automated_control_tests/Ni50Fe27Ga23 12_2 heat shield iso-stress_run31
    stage: baseline_0p6_time_precision_comparison
reporting:
  required: true
  report_path: reports/mini_dma_12_2_heat_shield_33p68mm_report.pdf
  image_dir: reports/images/heat_shield_12_2_33p68mm
  summary_path: analysis/mini_dma_12_2_heat_shield_33p68mm_summary.json
  run_quality_cache: run_quality.json
  per_run_core_plot_pattern: reports/images/heat_shield_12_2_33p68mm/{run_name}_core.png
  send_per_run_core_plot_to_master: true
  require_core_plots: true
  core_plots:
    - stress_vs_time
    - strain_vs_current
  highlight_current_hold: true
  include_trace_replay: true
  include_ramp_speed_comparison: true
